name: Dependency Audit

# Scheduled, non-PR-blocking supply-chain scan (#646). Catches advisories
# published against already-merged dependency versions — routine version
# updates are handled separately by dependabot.yml on a monthly cadence.
# See .github/CONTRIBUTING.md § 9 (Dependency update policy) for response
# windows by severity.
#
# The Rust WASM build chain (scanner/, compiled with wasm-pack) is audited
# separately and PR-blockingly (#486): its dependency tree — including
# wasm-bindgen and the rest of the wasm32 target closure — is checked on every
# pull request so a vulnerable build dependency cannot reach `main` unnoticed.

on:
  pull_request:
    branches: ["main"]
  schedule:
    # Every Monday at 07:00 UTC (offset from the 06:00 scanner-testnet job).
    - cron: "0 7 * * 1"
  workflow_dispatch:

jobs:
  cargo-audit:
    name: cargo audit / cargo deny (workspace)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check
        run: cargo deny check

  scanner-audit:
    name: cargo audit (scanner / wasm-pack)
    # PR-blocking: runs on every pull request so the WASM build chain — and
    # wasm-bindgen in particular — is monitored separately from the contracts
    # workspace (#486). `cargo audit` exits non-zero when advisories are found,
    # which fails the check and blocks the PR until triaged within SLA.
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scanner/target
          key: ${{ runner.os }}-scanner-cargo-${{ hashFiles('scanner/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: cargo audit (scanner workspace)
        working-directory: scanner
        run: cargo audit

      - name: Track wasm-bindgen advisories
        # Explicitly surface advisories that affect wasm-bindgen (or its direct
        # wasm-build-closure deps) so they are never hidden inside a broader
        # audit pass. Fails the PR if any such advisory is present.
        working-directory: scanner
        run: |
          advisories=$(cargo audit --json 2>/dev/null | jq -r '
            .vulnerabilities.list[]
            | select(.package.name == "wasm-bindgen"
                     or .package.name == "wasm-bindgen-backend"
                     or .package.name == "wasm-bindgen-macro"
                     or .package.name == "wasm-bindgen-macro-support")
            | "\(.package.name)@\(.package.version): \(.advisory.id) - \(.advisory.title)"
          ')
          if [ -n "$advisories" ]; then
            echo "::error::wasm-bindgen advisories detected — triage within SLA per CONTRIBUTING.md § 12:"
            echo "$advisories"
            exit 1
          fi
          echo "No wasm-bindgen advisories."

  npm-audit:
    name: npm supply-chain audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Audit production dependency trees
        run: npm run audit:supply-chain
