name: Circuit Benchmarks

on:
  push:
    branches: [ main ]
    paths:
      - 'circuits/**'
      - 'frontend/public/circuits/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'circuits/**'
      - 'frontend/public/circuits/**'
  schedule:
    # Run benchmarks weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'

jobs:
  benchmarks:
    name: Circuit Proof Generation Benchmarks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Install benchmark dependencies
        run: npm ci --prefix circuits/benchmarks

      - name: Run circuit benchmarks
        run: |
          cd circuits/benchmarks
          npm run bench:ci

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: circuits/benchmarks/results/
          retention-days: 90

      - name: Comment on PR with benchmark results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'circuits/benchmarks/results/latest.json';
            
            if (!fs.existsSync(resultsPath)) {
              return;
            }
            
            const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
            
            let body = '## Circuit Benchmark Results\n\n';
            body += '| Circuit | Witness Gen | Proof Gen | Total | Proof Size | Device |\n';
            body += '|:--------|:------------|:----------|:------|:-----------|:-------|\n';
            
            for (const result of results) {
              body += `| ${result.circuitVersion} | ${result.witnessGenTimeMs}ms | ${result.proofGenTimeMs}ms | ${result.totalTimeMs}ms | ${result.proofSizeBytes}B | ${result.deviceProfile} |\n`;
            }
            
            body += '\n### P95 Targets\n';
            body += '- Witness generation: ≤ 30,000ms\n';
            body += '- Proof generation: ≤ 120,000ms\n';
            body += '- Total: ≤ 150,000ms\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
