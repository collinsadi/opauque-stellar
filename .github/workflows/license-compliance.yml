name: License Compliance

# Verifies bundled WASM/circuit dependencies stay covered by
# THIRD_PARTY_NOTICES.md, and that Rust crate licenses stay inside the
# deny.toml allow list (#470). See .github/CONTRIBUTING.md
# "Third-party notices (license compliance)" under § 13.

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "scanner/Cargo.toml"
      - "scanner/Cargo.lock"
      - "deny.toml"
      - "circuits/package.json"
      - "circuits/package-lock.json"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "THIRD_PARTY_NOTICES.md"
      - "scripts/third-party-notices-lib.ts"
      - "scripts/generate-third-party-notices.ts"
      - "scripts/verify-third-party-notices.ts"
      - ".github/workflows/license-compliance.yml"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  cargo-license-check:
    name: cargo deny check licenses
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            scanner/target
          key: ${{ runner.os }}-license-cargo-${{ hashFiles('Cargo.lock', 'scanner/Cargo.lock') }}

      - name: Install cargo-deny (pinned prebuilt)
        uses: ./.github/actions/install-audit-tools
        with:
          audit: "false"

      - name: cargo deny check licenses (contracts workspace)
        run: cargo deny check licenses

      - name: cargo deny check licenses (scanner)
        working-directory: scanner
        run: cargo deny check licenses

  notices-check:
    name: THIRD_PARTY_NOTICES verification
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # scripts/third-party-notices-lib.ts shells out to `cargo metadata`
      # (root workspace + scanner/) to enumerate Rust crate licenses.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # stable

      - name: Cache cargo registry
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-notices-cargo-${{ hashFiles('Cargo.lock', 'scanner/Cargo.lock') }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"

      - name: Install root tooling
        run: npm ci

      - name: Install circuits dependencies
        run: npm ci
        working-directory: circuits

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Verify THIRD_PARTY_NOTICES.md is current and every bundled dependency is covered
        run: npm run notices:verify
