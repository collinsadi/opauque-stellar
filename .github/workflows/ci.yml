name: CI Matrix

# PR-blocking smoke builds across the supported Node and Rust version
# matrix. Failures name the exact version combo so contributors can
# reproduce locally. See .github/CONTRIBUTING.md § 3 for the supported
# version list.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Frontend: Node 20 / 22 ──────────────────────────────────────────
  frontend:
    name: Frontend (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint
        run: npm run lint --prefix frontend

      - name: Typecheck
        run: npx tsc -b --noEmit --prefix frontend

      - name: Unit tests
        run: npm test --prefix frontend

      - name: Production build
        run: npm run build --prefix frontend

  # ── Contracts: Rust stable ───────────────────────────────────────────
  contracts:
    name: Contracts (Rust ${{ matrix.rust-toolchain }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust-toolchain: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust-toolchain }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust-toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ matrix.rust-toolchain }}-${{ hashFiles('Cargo.lock') }}

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace --locked

  # ── Circuits regression suite ───────────────────────────────────────
  circuits:
    name: Circuits regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect circuit changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            circuits:
              - 'circuits/**'

      - name: Setup Node.js 20
        if: steps.changes.outputs.circuits == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: circuits/package-lock.json

      - name: Install circuit dependencies
        if: steps.changes.outputs.circuits == 'true'
        run: npm ci --prefix circuits

      - name: Install root dependencies (for tsx)
        if: steps.changes.outputs.circuits == 'true'
        run: npm ci

      - name: Run circuit regression suite
        if: steps.changes.outputs.circuits == 'true'
        run: npx tsx circuits/test/regression.ts --witness-only

  # ── Scanner WASM: Rust stable + Node 20 ─────────────────────────────
  scanner:
    name: Scanner WASM (Rust stable + Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable (pinned via scanner/rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-scanner-${{ hashFiles('scanner/Cargo.lock') }}

      - name: Install root dependencies
        run: npm ci

      - name: Build scanner WASM
        run: npm run build:scanner

      - name: Verify artifact manifest (scanner)
        run: npx tsx scripts/verify-artifact-manifest.ts --scanner --strict

      - name: Verify embedded VK hash integrity
        run: npx tsx scripts/verify-artifact-manifest.ts --vk-binding --strict

      - name: Byte-stability check (rebuild + compare hash)
        run: npx tsx scripts/check-scanner-byte-stability.ts
  # ── Scanner crate: Rust stable (fmt + clippy + tests) ────────────────
  scanner-crate:
    name: Scanner crate (Rust stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            scanner:
              - 'scanner/**'

      - name: Install Rust stable
        if: steps.changes.outputs.scanner == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and build artifacts
        if: steps.changes.outputs.scanner == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scanner/target
          key: ${{ runner.os }}-cargo-scanner-crate-${{ hashFiles('scanner/Cargo.lock') }}

      - name: Formatting
        if: steps.changes.outputs.scanner == 'true'
        working-directory: scanner
        run: cargo fmt --all -- --check

      - name: Clippy
        if: steps.changes.outputs.scanner == 'true'
        working-directory: scanner
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        if: steps.changes.outputs.scanner == 'true'
        working-directory: scanner
        run: cargo test --workspace --locked

  # ── Scanner WASM benchmark regression gate (#772) ───────────────────
  # Separate job from `scanner` above: this needs a *nodejs*-target
  # wasm-pack build (to run the compiled scanner directly under Node),
  # distinct from the `web`-target build the frontend consumes.
  scanner-benchmark-gate:
    name: Scanner WASM benchmark regression gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            scanner/target
          key: ${{ runner.os }}-cargo-scanner-bench-${{ hashFiles('scanner/Cargo.lock') }}

      - name: Install wasm-pack
        run: bash scripts/install-wasm-pack.sh
        env:
          WASM_PACK_INSTALL_DIR: /usr/local/bin

      - name: Install SDK dependencies
        run: npm ci --prefix sdk

      - name: Build scanner WASM (nodejs target)
        working-directory: scanner
        run: wasm-pack build --target nodejs --out-dir ../sdk/wasm-node-pkg --release

      - name: Run WASM scan throughput regression gate
        working-directory: sdk
        run: npm run benchmark:scan:gate

  # ── Poseidon crates: Rust stable (fmt + clippy + tests) ──────────────
  poseidon-crates:
    name: Poseidon crates (Rust stable)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Detect relevant changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            poseidon:
              - 'contracts/opaque-poseidon/**'
              - 'contracts/poseidon-bench/**'

      - name: Install Rust stable
        if: steps.changes.outputs.poseidon == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        if: steps.changes.outputs.poseidon == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/opaque-poseidon/target
            contracts/poseidon-bench/target
          key: ${{ runner.os }}-cargo-poseidon-${{ hashFiles('contracts/opaque-poseidon/Cargo.lock', 'contracts/poseidon-bench/Cargo.lock') }}

      - name: Formatting (opaque-poseidon)
        if: steps.changes.outputs.poseidon == 'true'
        working-directory: contracts/opaque-poseidon
        run: cargo fmt --all -- --check

      - name: Clippy (opaque-poseidon)
        if: steps.changes.outputs.poseidon == 'true'
        working-directory: contracts/opaque-poseidon
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (opaque-poseidon, includes Poseidon constants vectors)
        if: steps.changes.outputs.poseidon == 'true'
        working-directory: contracts/opaque-poseidon
        run: cargo test --workspace --locked

      - name: Formatting (poseidon-bench)
        if: steps.changes.outputs.poseidon == 'true'
        working-directory: contracts/poseidon-bench
        run: cargo fmt --all -- --check

      - name: Clippy (poseidon-bench)
        if: steps.changes.outputs.poseidon == 'true'
        working-directory: contracts/poseidon-bench
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests (poseidon-bench)
        if: steps.changes.outputs.poseidon == 'true'
        working-directory: contracts/poseidon-bench
        run: cargo test --workspace --locked

  # ── SDK: Node 20 ────────────────────────────────────────────────────
  sdk:
    name: SDK (Node 20)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        run: npm ci --prefix sdk

      - name: Install root dependencies
        run: npm ci

      - name: SDK address drift check
        run: npx tsx scripts/generate-sdk-addresses.ts --check

      - name: Lint
        run: npm run lint --prefix sdk

      - name: Typecheck
        run: npm run typecheck --prefix sdk

      - name: Build
        run: npm run build --prefix sdk

      - name: Export checks
        run: npm run check:exports --prefix sdk

      - name: Tests
        run: npm test --prefix sdk

  # ── Workflow lint: catch undefined npm run scripts ─────────────────────
  workflow-lint:
    name: Workflow script lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate workflow scripts
        run: ./scripts/validate-workflow-scripts.sh

  # ── Service images: asp, publisher, relayer (#770) ──────────────────
  service-images:
    name: Build ${{ matrix.service }} image
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [asp, publisher, relayer]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.service }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          load: true
          tags: opaque-${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Verify non-root runtime user
        run: |
          user="$(docker run --rm --entrypoint id opaque-${{ matrix.service }}:ci -u)"
          echo "runtime user: $user"
          [ "$user" != "0" ]

      - name: Verify HEALTHCHECK is declared
        run: |
          healthcheck="$(docker inspect --format='{{.Config.Healthcheck}}' opaque-${{ matrix.service }}:ci)"
          echo "$healthcheck"
          [ "$healthcheck" != "<nil>" ]

  # ── Supply chain: cargo audit + deny + npm audit ──────────────────────
  supply-chain:
    name: Supply chain audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-audit-${{ hashFiles('Cargo.lock') }}

      - name: Install cargo-audit and cargo-deny
        run: cargo install cargo-audit cargo-deny --locked

      - name: cargo audit
        run: cargo audit

      - name: cargo deny check
        run: cargo deny check

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies
        run: npm ci

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: npm audit (root)
        run: npm audit --omit=dev
        continue-on-error: true

      - name: npm audit (frontend)
        run: npm audit --omit=dev --prefix frontend
        continue-on-error: true
