[package]
name = "stealth-announcer-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = "=1.3.2"
soroban-sdk = { workspace = true, features = ["testutils"] }
stealth-announcer = { path = "../contracts/stealth-announcer" }

[[bin]]
name = "announce-payload-length"
path = "fuzz_targets/announce_payload_length.rs"
test = false
doc = false
bench = false

[[bin]]
name = "announce-scheme-id"
path = "fuzz_targets/announce_scheme_id.rs"
test = false
doc = false
bench = false

[[bin]]
name = "announce-key-prefix"
path = "fuzz_targets/announce_key_prefix.rs"
test = false
doc = false
bench = false
